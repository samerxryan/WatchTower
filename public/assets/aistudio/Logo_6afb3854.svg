<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100" fill="none">
  <defs>
    <!-- Primary Indigo-Cyan Gradient -->
    <linearGradient id="towerGrad" x1="16" y1="12" x2="84" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Subtle Beam Glow -->
    <linearGradient id="beamGrad" x1="50" y1="30" x2="92" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Badge -->
  <rect x="10" y="10" width="80" height="80" rx="20" fill="#0F172A" />
  <rect x="10.75" y="10.75" width="78.5" height="78.5" rx="19.25" stroke="#1E293B" stroke-width="1.5" />

  <!-- Radar / Searchlight Sweeps -->
  <path d="M50 31 L84 18 L84 44 Z" fill="url(#beamGrad)" />
  <path d="M50 31 L16 18 L16 44 Z" fill="url(#beamGrad)" transform="rotate(180 50 31)" opacity="0.5" />

  <!-- Tower Roof / Cap -->
  <path d="M36 25 L50 16 L64 25 Z" fill="url(#towerGrad)" />

  <!-- Observation Deck -->
  <rect x="38" y="27" width="24" height="8" rx="2" fill="#E2E8F0" />
  <!-- Beacon Core -->
  <circle cx="50" cy="31" r="2.5" fill="#38BDF8" />

  <!-- Tower Structural Legs & Cross-bracing -->
  <path d="M41 37 L34 78 H41 L46 37 Z" fill="url(#towerGrad)" />
  <path d="M59 37 L66 78 H59 L54 37 Z" fill="url(#towerGrad)" />
  <!-- Horizontal & Diagonal Support Bars -->
  <rect x="38" y="51" width="24" height="3.5" rx="1.5" fill="#94A3B8" />
  <rect x="35" y="65" width="30" height="3.5" rx="1.5" fill="#94A3B8" />

  <!-- Wordmark: WatchTower -->
  <text x="108" y="60" font-family="Inter, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="36" letter-spacing="-0.03em">
    <tspan font-weight="700" fill="#0F172A">Watch</tspan><tspan font-weight="500" fill="#4F46E5">Tower</tspan>
  </text>

  <!-- Subtle Technical Subtitle / Accent Dot -->
  <circle cx="312" cy="56" r="4" fill="#38BDF8" />
</svg>
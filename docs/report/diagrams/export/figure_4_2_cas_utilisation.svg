<text x="56" y="902" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="normal" fill="#475569" text-anchor="start">Le chef de projet cumule les cas d&#x27;utilisation du membre sur les projets qu&#x27;il possède ou gère ; l&#x27;administrateur dispose en plus des droits globaux de gestion.</text>
<text x="56" y="919" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="normal" fill="#475569" text-anchor="start">Aucune généralisation entre acteurs n&#x27;est utilisée : l&#x27;accès effectif dépend de l&#x27;appartenance au projet (owner_id ou ligne project_members), pas du seul rôle global.</text>
<text x="56" y="938" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="normal" fill="#64748B" text-anchor="start" font-style="italic">«include» : le changement de statut déclenche systématiquement le contrôle des droits (assertTaskAccess) avant toute écriture en base.</text>

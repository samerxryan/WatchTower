<text x="56" y="442" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="start">Méthode de calcul</text>
<text x="56" y="460" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="normal" fill="#475569" text-anchor="start">ES = maximum des EF des prédécesseurs ; EF = ES + durée ; LF = minimum des LS des successeurs ; LS = LF − durée ; marge = LS − ES.</text>
<text x="56" y="479" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="700" fill="#DC2626" text-anchor="start">Chemin critique : A → B → C → D → F → G → I → K → L  (total 12 semaines, toutes les marges y sont nulles).</text>
<text x="56" y="498" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="normal" fill="#475569" text-anchor="start">Activités à marge : E (3 s.), H (1 s.), J (1 s.). Le réseau utilise exactement les mêmes durées et dépendances que le Gantt.</text>
<text x="56" y="517" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#64748B" text-anchor="start">Hypothèse de planification : durées exprimées en semaines relatives ; la durée du chemin critique est cohérente avec la durée prévisionnelle globale de 12 semaines.</text>
</svg>
